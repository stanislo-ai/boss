<div class="wrap narrow auth">
  <div class="panel">
    <span class="eyebrow">Panel</span>
    <h1>Zaloguj się</h1>
    <p class="intro">Witaj z powrotem w BiznesCreator.</p>
    <div class="alert alert-error hidden" data-error></div>
    <form data-form novalidate>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-block" type="submit">Zaloguj się</button>
    </form>
    <p class="below">Nie masz konta? <a href="/rekrutacja">Weź udział w rekrutacji</a><br>Nie pamiętasz hasła? Napisz do administratora, wyśle Ci link do zmiany hasła.</p>
  </div>
</div>
