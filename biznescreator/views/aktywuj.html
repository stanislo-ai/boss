<div class="wrap narrow auth">
  <div class="panel">
    <span class="eyebrow">Konto</span>
    <h1 data-title>Ustaw hasło</h1>
    <p class="intro" data-lead>Sprawdzam link…</p>
    <div class="alert alert-error hidden" data-error></div>
    <form data-form class="hidden" novalidate>
      <div class="field"><label for="password">Nowe hasło</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><span class="hint">Min. 12 znaków, litery i cyfry. Najlepiej całe zdanie, np. „Moje3PsyLubiąPizzę”.</span></div>
      <div class="field"><label for="password2">Powtórz hasło</label><input id="password2" name="password2" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-block" type="submit">Zapisz hasło i wejdź</button>
    </form>
  </div>
</div>
