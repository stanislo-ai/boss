<div class="wrap narrow page">
  <div class="page-head"><div><span class="eyebrow">Ustawienia</span><h1>Twoje konto</h1></div></div>
  <div class="panel">
    <h3 class="mb16">Zmień hasło</h3>
    <div class="alert hidden" data-msg></div>
    <form data-form novalidate>
      <div class="field"><label for="current">Obecne hasło</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="password">Nowe hasło</label><input id="password" name="password" type="password" autocomplete="new-password" required><span class="hint">Min. 12 znaków, litery i cyfry.</span></div>
      <button class="btn" type="submit">Zmień hasło</button>
    </form>
  </div>
  <div class="panel mt16">
    <h3 class="mb8">Sesje</h3>
    <p class="muted small mb16">Wyloguj się ze wszystkich urządzeń, np. gdy logowałeś się na cudzym komputerze.</p>
    <button class="btn btn-ghost" data-logout-all>Wyloguj wszędzie</button>
  </div>
</div>
